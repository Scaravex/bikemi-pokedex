<body>
<div id="rep">
  <h1>BikeMi Pokédex — test automatici</h1>
  <p id="sum">In preparazione…</p>
  <button id="again" onclick="location.reload()">Esegui di nuovo</button>
  <div id="out"></div>
</div>
<iframe id="frame" title="App sotto test"></iframe>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// I test usano stazioni e corse inventate: nessun dato personale. Girano solo in
// locale perché svuotano i dati salvati dell'app su questo indirizzo; quelli
// presenti all'avvio vengono rimessi a posto alla fine.
// ─────────────────────────────────────────────────────────────────────────────
if(!['localhost','127.0.0.1','[::1]'].includes(location.hostname)){
  document.body.innerHTML='<div id="stop">I test si aprono solo da un server locale, per esempio con<br><code>python -m http.server</code> nella cartella del progetto.<br><br>Sul sito pubblicato cancellerebbero i dati salvati dell\'app.</div>';
  throw new Error('test fuori da localhost');
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const frame=document.getElementById('frame');
const IOS='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Version/18.0 Mobile/15E148 Safari/604.1';
const AND='Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 Chrome/130.0 Mobile Safari/537.36';

// 30 stazioni a spirale attorno al Duomo, ognuna mezzo chilometro più lontana della
// precedente: le 21 più lontane (S10–S30) prendono i leggendari, S01–S09 sono normali.
const C=[45.4642,9.19];
const ST=Array.from({length:30},(_,i)=>{
  const k=i+1, r=0.5*k, a=k*47*Math.PI/180;
  return {station_id:'S'+String(k).padStart(2,'0'), name:k+' - Via Prova '+k, address:'Via Prova '+k,
    lat:+(C[0]+r*Math.cos(a)/111.32).toFixed(6), lon:+(C[1]+r*Math.sin(a)/(111.32*Math.cos(C[0]*Math.PI/180))).toFixed(6)};
});
const S=id=>ST.find(s=>s.station_id===id);
const giorno=off=>{ const d=new Date(); d.setDate(d.getDate()+off); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
let nTrip=0;
function corsa(a,b,g=giorno(-2),min=20){
  const s=S(a)||{station_id:a,name:a,address:'',lat:45.6,lon:9.0}, e=S(b)||{station_id:b,name:b,address:'',lat:45.61,lon:9.01};
  return {_id:'T'+(++nTrip),_tripStarted:g+'T10:00:00.000Z',_tripEnded:g+'T10:'+String(min).padStart(2,'0')+':00.000Z',_tripDuration:min*60,
    _startStation:{_id:s.station_id,_title:s.name,_subtitle:s.address,_coords:{_latitude:s.lat,_longitude:s.lon}},
    _endStation:{_id:e.station_id,_title:e.name,_subtitle:e.address,_coords:{_latitude:e.lat,_longitude:e.lon}}};
}
// Export di partenza: catturate S01–S06.
const BASE=()=>[corsa('S01','S02'),corsa('S03','S04'),corsa('S05','S06'),corsa('S02','S01')];

// ── zip scritto a mano, per provare il caricamento dello zip senza file veri ──
async function zip(files,data){
  // data 'AAAA-MM-GG' scritta nello zip come fa BikeMi; senza, campo vuoto
  let dos=0; if(data){ const [a,m,g]=data.split('-').map(Number); dos=((a-1980)<<9)|(m<<5)|g; }
  const enc=new TextEncoder(), parts=[], cd=[]; let off=0;
  for(const f of files){
    const raw=enc.encode(f.text), nome=enc.encode(f.name);
    const dati=f.deflate ? new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer()) : raw;
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(8,f.deflate?8:0,true); h.setUint16(12,dos,true);
    h.setUint32(18,dati.length,true); h.setUint32(22,raw.length,true); h.setUint16(26,nome.length,true);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(10,f.deflate?8:0,true); c.setUint16(14,dos,true);
    c.setUint32(20,dati.length,true); c.setUint32(24,raw.length,true); c.setUint16(28,nome.length,true); c.setUint32(42,off,true);
    parts.push(new Uint8Array(h.buffer),nome,dati); cd.push(new Uint8Array(c.buffer),nome);
    off+=30+nome.length+dati.length;
  }
  const cdLen=cd.reduce((a,b)=>a+b.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true);
  e.setUint32(12,cdLen,true); e.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(e.buffer)]);
}

// ── l'app gira in un iframe, con rete, GPS, permessi e telefono simulati ──
const T={};
window.__T=T;
const STUB=`<script>(function(){
  const T=parent.__T, real=window.fetch.bind(window);
  window.fetch=async(u,o)=>{ u=String(u); T.calls.push(u);
    if(u.includes('urbansharing')){ if(T.gbfs==='giu') throw new TypeError('offline');
      return new Response(JSON.stringify({data:{stations:T.gbfs}}),{status:200}); }
    if(u.includes('valhalla')){ if(T.valhalla==='giu') throw new TypeError('offline');
      return new Response(JSON.stringify({trip:{summary:{length:9.5,time:1800}}}),{status:200}); }
    return real(u,o); };
  const g=navigator.geolocation;
  g.watchPosition=(ok,ko)=>{ T.watch={ok,ko}; T.watchCount++; return 1; };
  g.clearWatch=()=>{ T.watch=null; };
  g.getCurrentPosition=(ok,ko)=>{ T.gcp++; T.pos?ok({coords:T.pos}):ko({code:2}); };
  Object.defineProperty(navigator,'userAgent',{configurable:true,get:()=>T.ua});
  Object.defineProperty(navigator,'maxTouchPoints',{configurable:true,get:()=>T.touch});
  Object.defineProperty(navigator,'permissions',{configurable:true,get:()=>T.perm==='nessuna'?undefined:{query:async()=>({state:T.perm})}});
  Object.defineProperty(document,'hidden',{configurable:true,get:()=>!!T.hidden});
  const mm=window.matchMedia.bind(window);
  window.matchMedia=q=>/reduced-motion/.test(q)?{matches:true,media:q,addListener(){},removeListener(){},addEventListener(){},removeEventListener(){}}:mm(q);
  window.open=u=>{ T.opened.push(String(u)); return null; };
  window.confirm=()=>true;
  try{ navigator.vibrate=()=>true; }catch(e){}
  if(navigator.serviceWorker) navigator.serviceWorker.register=()=>Promise.resolve();
})();<\/script>`;

let HTML='', nLoad=0;
async function app(opz={}){
  Object.assign(T,{calls:[],opened:[],watch:null,watchCount:0,gcp:0,pos:null,gbfs:ST.slice(),valhalla:'su',
    ua:AND,touch:5,perm:'granted',hidden:false},opz);
  // L'app sta nella cartella sopra: senza <base> manifest e icone si cercherebbero in tests/.
  frame.srcdoc=HTML.replace('<head>','<head><base href="../">'+STUB)+'<!--'+(++nLoad)+'-->';
  await new Promise(r=>frame.onload=r);
  await sleep(300);
  return frame.contentWindow;
}
function pulito(){ for(const k of Object.keys(localStorage)) if(k.startsWith('bm_')) localStorage.removeItem(k); }
async function carica(w,dati,nome='trips.json',opz){
  const corpo=dati instanceof Blob?dati:(typeof dati==='string'?dati:JSON.stringify(dati));
  await w.processFile(new w.File([corpo],nome,opz)); await sleep(150);
}
function vicino(w,st,metri,acc=10){
  if(!T.watch) throw new Error('il GPS non è partito');
  T.watch.ok({coords:{latitude:st.lat+metri/111320,longitude:st.lon,accuracy:acc}});
}
function cattura(w,id){ vicino(w,S(id),10); w.closeCatch(false); }
const preso=(w,id)=>!!V(w,'D').find(d=>d.id===id)?.v;
const quante=w=>V(w,'D').filter(d=>d.v).length;
const avviso=w=>w.document.getElementById('toast').textContent;
const el=(w,id)=>w.document.getElementById(id);
const card=(w,id)=>w.document.querySelector('#grid .card[data-i="'+V(w,'D').findIndex(d=>d.id===id)+'"]');

// let e const dell'app non diventano proprietà di window: si leggono dentro l'iframe.
const V=(w,espr)=>w.eval(espr);
function ok(cond,msg){ if(!cond) throw new Error(msg); }
function eq(a,b,msg){ if(a!==b) throw new Error(msg+': atteso '+JSON.stringify(b)+', trovato '+JSON.stringify(a)); }

const TEST=[];
const t=(gruppo,nome,fn)=>TEST.push({gruppo,nome,fn});

// ═══ 1. Primo caricamento ═══
t('Primo caricamento','Carico trips.json: 6 stazioni catturate su 30',async()=>{
  pulito(); const w=await app(); await carica(w,BASE());
  eq(el(w,'up-err').textContent,'','nessun errore');
  eq(el(w,'app').style.display,'flex','app aperta');
  eq(V(w,'D').length,30,'stazioni'); eq(quante(w),6,'catturate');
  eq(el(w,'pl').textContent,'6/30','barra in alto');
  eq(Object.keys(V(w,'GPS')).length,0,'catture GPS');
});
t('Primo caricamento','La schermata iniziale non scrive un numero fisso di stazioni',async()=>{
  pulito(); const w=await app();
  const testo=w.document.querySelector('#upload .sub').textContent;
  ok(!/\d/.test(testo),'sottotitolo: '+testo);
});
t('Primo caricamento','Carico lo zip di BikeMi così com\'è, non compresso',async()=>{
  pulito(); const w=await app();
  await carica(w,await zip([{name:'orders.json',text:'[]'},{name:'trips.json',text:JSON.stringify(BASE())}]),'export.zip');
  eq(el(w,'up-err').textContent,'','nessun errore'); eq(quante(w),6,'catturate');
});
t('Primo caricamento','Carico uno zip compresso',async()=>{
  if(typeof CompressionStream==='undefined') throw new Error('questo browser non sa comprimere: test non eseguibile');
  pulito(); const w=await app();
  await carica(w,await zip([{name:'trips.json',text:JSON.stringify(BASE()),deflate:true}]),'export.zip');
  eq(el(w,'up-err').textContent,'','nessun errore'); eq(quante(w),6,'catturate');
});
t('Primo caricamento','File sbagliato: errore chiaro, l\'app non si apre',async()=>{
  pulito(); const w=await app(); await carica(w,'ciao','note.txt');
  ok(el(w,'up-err').textContent.includes('non è un JSON valido'),'messaggio: '+el(w,'up-err').textContent);
  ok(el(w,'app').style.display!=='flex','app rimasta chiusa');
});
t('Primo caricamento','Zip senza trips.json: l\'errore dice cosa contiene',async()=>{
  pulito(); const w=await app();
  await carica(w,await zip([{name:'orders.json',text:'[]'},{name:'penalties.json',text:'[]'}]),'export.zip');
  const m=el(w,'up-err').textContent;
  ok(m.includes('non trovo trips.json')&&m.includes('orders.json'),'messaggio: '+m);
});

t('Primo caricamento','Lancio delle Poké Ball: le catturate partono coperte e alla fine sono tutte scoperte',async()=>{
  pulito(); const w=await app(); await carica(w,BASE());
  w.prepareThrow();
  eq(V(w,'curTab'),'pok','scheda aperta');
  const c=card(w,'S01'), pk=c.querySelector('.pk');
  eq(w.getComputedStyle(pk).fontSize,'0px','nome vero di una catturata ancora coperta');
  eq(w.getComputedStyle(pk,'::after').content,'"???"','al suo posto compare');
  eq(w.getComputedStyle(c.querySelector('.sn')).color,w.getComputedStyle(card(w,'S07').querySelector('.sn')).color,'stazione colorata come una non catturata');
  eq(w.document.querySelectorAll('#grid .card.pend').length,6,'schede coperte');
  await w.throwBalls('');
  eq(w.document.querySelectorAll('#grid .card.pend').length,0,'schede ancora coperte');
  eq(w.document.querySelectorAll('.fly').length,0,'Poké Ball rimaste a schermo');
  eq(w.document.querySelectorAll('#grid .card.C').length,6,'catturate scoperte');
  eq(card(w,'S07').querySelector('.pk').textContent,'???','una non catturata resta nascosta');
  ok(avviso(w).includes('Pokédex pronto: 6 catturati su 30'),'avviso: '+avviso(w));
});

t('Primo caricamento','Lancio con tutte le stazioni catturate: solo le prime schermate, poi basta',async()=>{
  pulito(); const w=await app();
  await carica(w,ST.map((s,i)=>corsa(s.station_id,ST[(i+1)%30].station_id)));
  w.prepareThrow();
  const tab=w.document.getElementById('tab-pok');
  let palle=0, scorso=0;
  const oss=new w.MutationObserver(m=>m.forEach(r=>r.addedNodes.forEach(n=>{ if(n.classList&&n.classList.contains('fly')) palle++; })));
  oss.observe(w.document.body,{childList:true});
  const iv=setInterval(()=>{ scorso=Math.max(scorso,tab.scrollTop); },40);
  await w.throwBalls(''); oss.disconnect(); clearInterval(iv);
  const max=V(w,'THROW_SCREENS*BALLS_PER_SCREEN');
  ok(palle>=1&&palle<=max,'Poké Ball lanciate: '+palle+' (massimo '+max+')');
  ok(palle<30,'una Poké Ball per ognuna delle 30 catture: il lancio non si ferma alle prime schermate');
  ok(scorso>0,'non è passato alla seconda schermata');
  eq(tab.scrollTop,0,'alla fine torna in cima');
  eq(w.document.querySelectorAll('#grid .card.pend').length,0,'schede ancora coperte');
});

t('Primo caricamento','Ordine delle schede: Stats, Pokédex, Mappa, Vicino, e lo scorrimento lo segue',async()=>{
  pulito(); const w=await app(); await carica(w,BASE());
  const etichette=[...w.document.querySelectorAll('#nav .nb')].map(b=>b.textContent.replace(/[^A-Za-zé]/g,''));
  eq(etichette.join(' '),'Stats Pokédex Mappa Vicino','barra in basso');
  w.goTab('stats'); const giro=[V(w,'curTab')];
  for(let i=0;i<3;i++){ w.stepTab(1); giro.push(V(w,'curTab')); }
  eq(giro.join(' '),'stats pok mappa near','scorrendo verso sinistra');
  w.stepTab(1); eq(V(w,'curTab'),'near','oltre l\'ultima resta su Vicino');
});

t('Primo caricamento','Mappa: ogni stazione ha "Naviga fino qui" verso Google Maps in bici',async()=>{
  pulito(); const w=await app(); await carica(w,BASE());
  if(!w.L) throw new Error('libreria della mappa non caricata: serve la rete per unpkg.com');
  w.goTab('mappa'); await sleep(700);
  const marker=V(w,'layer').getLayers();
  eq(marker.length,30,'stazioni sulla mappa');
  const s=S('S07'), html=marker.map(m=>m.getPopup().getContent()).find(h=>h.includes('7 - Via Prova 7'));
  ok(html,'fumetto della stazione 7 assente');
  ok(html.includes('travelmode=bicycling')&&html.includes('destination='+s.lat+','+s.lon),'link: '+(html.match(/href="[^"]+"/)||['nessuno'])[0]);
  ok(marker.every(m=>m.getPopup().getContent().includes('Naviga fino qui')),'una stazione senza il link');
});

t('Primo caricamento','Heatmap: si accende col 🔥, colora solo dove sono passato e resta accesa alla riapertura',async()=>{
  pulito(); let w=await app(); await carica(w,[...BASE(),corsa('S03','S04'),corsa('S03','S04')]);
  if(!w.L) throw new Error('libreria della mappa non caricata: serve la rete per unpkg.com');
  w.goTab('mappa'); await sleep(700);
  eq(el(w,'heat-btn').getAttribute('aria-pressed'),'false','spenta al primo avvio');
  w.toggleHeat(); await sleep(100);
  eq(localStorage.getItem('bm_heat'),'1','scelta salvata');
  ok(el(w,'heat-leg').classList.contains('on'),'legenda nascosta');
  const {pt,max}=w.heatPoints();
  eq(pt.length,6,'stazioni con passaggi'); eq(max,3,'passaggi della stazione più frequentata (S03)');
  const m=V(w,'mapObj');
  m.fitBounds(ST.slice(0,9).map(s=>[s.lat,s.lon]),{animate:false}); w.drawHeat();
  const cv=V(w,'heatCv'), g=cv.getContext('2d');
  ok(cv.width>0&&cv.height>0,'canvas vuoto: '+cv.width+'×'+cv.height);
  const alfa=id=>{ const p=m.latLngToContainerPoint([S(id).lat,S(id).lon]); return g.getImageData(Math.round(p.x),Math.round(p.y),1,1).data[3]; };
  ok(alfa('S03')>0,'nessun colore sulla stazione più usata');
  eq(alfa('S09'),0,'colore su una stazione mai visitata e lontana');
  eq(w.getComputedStyle(m.getPane('heat')).pointerEvents,'none','la heatmap blocca i tocchi sui pallini');
  ok(!/invert/.test(w.getComputedStyle(m.getPane('tilePane')).filter),'sotto la heatmap la mappa è rimasta scura');
  const pall=V(w,'layer').getLayers(), verdi=pall.filter(c=>c.options.radius===3), grigi=pall.filter(c=>c.options.fillColor==='#475569');
  eq(verdi.length,6,'catturate quasi trasparenti sopra la heatmap'); ok(verdi.every(c=>c.options.fillOpacity<.5),'catturate ancora coprenti');
  eq(grigi.length,24,'stazioni da fare rimaste visibili');
  w = await app(); w.goTab('mappa'); await sleep(700);
  eq(el(w,'heat-btn').getAttribute('aria-pressed'),'true','riaperta l\'app la heatmap è spenta');
  w.toggleHeat(); await sleep(100);
  eq(localStorage.getItem('bm_heat'),'0','spegnimento non salvato');
  ok(!el(w,'heat-leg').classList.contains('on'),'legenda rimasta a schermo');
  eq(V(w,'heatCv').style.display,'none','heatmap rimasta a schermo');
  ok(/invert/.test(w.getComputedStyle(V(w,'mapObj').getPane('tilePane')).filter),'spenta la heatmap la mappa non è tornata scura');
});
t('Primo caricamento','trips.json senza corse: errore che lo dice, l\'app non si apre',async()=>{
  pulito(); const w=await app(); await carica(w,[]);
  ok(el(w,'up-err').textContent.includes('nessuna corsa'),'messaggio: '+el(w,'up-err').textContent);
  ok(el(w,'app').style.display!=='flex','app aperta senza dati');
});
t('Primo caricamento','Heatmap senza passaggi: avviso, nessun colore',async()=>{
  pulito(); const w=await app(); await carica(w,BASE());
  if(!w.L) throw new Error('libreria della mappa non caricata: serve la rete per unpkg.com');
  // Con un file vero non capita, ma il caso va gestito: senza passaggi nessuna stazione pesa.
  w.eval('AG.vc={}');
  w.goTab('mappa'); await sleep(700); w.toggleHeat(); await sleep(100);
  ok(avviso(w).includes('Nessun passaggio'),'avviso: '+avviso(w));
  ok(!el(w,'heat-leg').classList.contains('on'),'legenda senza dati');
  ok(/invert/.test(w.getComputedStyle(V(w,'mapObj').getPane('tilePane')).filter),'mappa schiarita senza niente da mostrare');
});
t('Primo caricamento','Mappa aperta, poi ↺ e nuovo file: la mappa si ricrea senza errori',async()=>{
  pulito(); const w=await app(); await carica(w,BASE());
  if(!w.L) throw new Error('libreria della mappa non caricata: serve la rete per unpkg.com');
  w.goTab('mappa'); await sleep(700);
  w.doReset(); await carica(w,[...BASE(),corsa('S07','S08')]);
  w.goTab('mappa'); await sleep(700);
  eq(V(w,'layer').getLayers().length,30,'stazioni sulla mappa nuova');
  ok(V(w,'mapObj').getContainer()===el(w,'map'),'mappa non ricreata');
});

t('Primo caricamento','Data dei dati: dallo zip si legge quando BikeMi l\'ha generato',async()=>{
  pulito(); const w=await app();
  // corse di due giorni fa, export generato ieri: la data dello zip è quella giusta
  await carica(w,await zip([{name:'trips.json',text:JSON.stringify(BASE())}],giorno(-1)),'export.zip');
  eq(V(w,'AG.exp'),giorno(-1),'data letta dallo zip');
  ok(el(w,'ghost').textContent.includes('Dati aggiornati al '+w.fmtDate(giorno(-1))),'nota: '+el(w,'ghost').textContent);
  eq(el(w,'s7').parentNode.querySelector('.sl').textContent,'Ultima corsa nel file','etichetta');
});
t('Primo caricamento','Data dei dati: da un trips.json si usa la data del file',async()=>{
  pulito(); const w=await app();
  const quando=new Date(); quando.setDate(quando.getDate()-1);
  await carica(w,BASE(),'trips.json',{lastModified:quando.getTime()});
  eq(V(w,'AG.exp'),giorno(-1),'data del file');
});
t('Primo caricamento','Data dei dati: mai più vecchia dell\'ultima corsa contenuta',async()=>{
  pulito(); const w=await app();
  await carica(w,await zip([{name:'trips.json',text:JSON.stringify(BASE())}],'2020-01-01'),'export.zip');

async function avvio(w,ua,perm,ricordo){
  w.stopWatch(); w.hideGeoChip(); T.watchCount=0; T.ua=ua; T.perm=perm;

  await w.startWatch();
  return {gps:T.watchCount>0, pulsante:el(w,'geochip').classList.contains('on')};
}

  ok(el(w,'tops').textContent.includes('Nessuna delle stazioni'),'preferite: '+el(w,'tops').textContent);
});

  pulito(); const w=await app(); await carica(w,[corsa('S01','S01')]);
  eq(el(w,'sc-km').style.display,'none','riquadro dei km');

t('Casi limite','Tratta più lunga: km su strada se il servizio risponde, stima ≈ se è giù',async()=>{
  pulito(); let w=await app(); await carica(w,BASE());
  let v=w.document.querySelector('#recs .rcv').textContent;

  pulito(); w=await app({valhalla:'giu'}); await carica(w,BASE());

// ═══ esecuzione ═══
(async()=>{
  const salvati={}; for(const k of Object.keys(localStorage)) if(k.startsWith('bm_')) salvati[k]=localStorage.getItem(k);
  const out=document.getElementById('out'), sum=document.getElementById('sum');
  HTML=await (await fetch('../index.html',{cache:'no-store'})).text();
  let gruppo='', passati=0, falliti=0; const t0=Date.now();
  try{
    for(const x of TEST){
      if(x.gruppo!==gruppo){ gruppo=x.gruppo; out.insertAdjacentHTML('beforeend','<h2>'+gruppo+'</h2>'); }
      const riga=document.createElement('div'); riga.className='t run';
      riga.innerHTML='<span class="e">…</span><span class="n"></span><span class="ms"></span>';
      riga.querySelector('.n').textContent=x.nome; out.appendChild(riga);
      const s=Date.now();
      try{ await x.fn(); riga.className='t ok'; riga.querySelector('.e').textContent='✓'; passati++; }
      catch(e){ riga.className='t ko'; riga.querySelector('.e').textContent='✗'; falliti++;
        const d=document.createElement('div'); d.className='d'; d.textContent=e.message; riga.querySelector('.n').appendChild(d); }
      riga.querySelector('.ms').textContent=(Date.now()-s)+' ms';
      sum.innerHTML='<b class="ok">'+passati+' passati</b> · <b class="'+(falliti?'ko':'ok')+'">'+falliti+' falliti</b> su '+TEST.length;
    }
  } finally {
    pulito(); for(const k in salvati) localStorage.setItem(k,salvati[k]);
    sum.innerHTML+=' · '+((Date.now()-t0)/1000).toFixed(1)+' s';
    window.__RISULTATO={passati,falliti,totale:TEST.length};
  }
})();
</script>
